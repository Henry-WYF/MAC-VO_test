Common:
  device: &device cuda

Odometry:
  name: MACVO-Performant-LoopPhaseB
  args:
    device: *device
    edgewidth: 32
    num_point: 200
    match_cov_default: 0.25
    profile: false
    mapping: true

  cov:
    obs:
      type: MatchCovariance
      args:
        device: *device
        kernel_size: 31
        match_cov_default: 0.25
        min_depth_cov: 0.05
        min_flow_cov: 0.25

  keypoint:
    type: CovAwareSelector_NoDepth
    args:
      device: *device
      kernel_size: 7
      mask_width: 32
      max_match_cov: 100.0

  mappoint:
    type: MappingPointSelector
    args:
      device: *device
      max_depth: 5.0
      max_depth_cov: 0.005
      mask_width: 32

  frontend:
    type: CUDAGraph_FlowFormerCovFrontend
    args:
      device: *device
      weight: ./Model/MACVO_FrontendCov.pth
      enc_dtype: fp32
      dec_dtype: fp32
      decoder_depth: 12
      enforce_positive_disparity: false

  motion:
    type: StaticMotionModel
    args:

  outlier:
    type: CovarianceSanityFilter
    args:

  postprocess:
    type: MotionInterpolate
    args:

  keyframe:
    type: AllKeyframe
    args:

  optimizer:
    type: TwoFrame_PGO
    args:
      device: cpu
      vectorize: true
      parallel: true
      graph_type: disp
      autodiff: false

  loop_closure:
    enabled: true
    recognizer_type: custom_binary
    vocabulary_path: ./Model/ORB_BoW_4096.npz
    bow_min_score: null
    keyframe_stride_sensor_frames: 10
    temporal_exclusion_sensor_frames: 100
    cache_failure_policy: disable_loop
    orb_nfeatures: 1000
    orb_scale_factor: 1.2
    orb_nlevels: 8
    top_k: 10

    geometric_verification:
      enabled: true
      max_candidates_to_verify: 10
      min_sensor_gap: 100
      compare_flow_cov_gate: true

    geometry:
      min_points: 30
      max_points: 800
      max_depth: 20.0
      max_depth_cov: 0.05
      flow_cov_gate_enabled: false
      # Experimental Phase B target at the covariance stage; null preserves the fixed gate.
      flow_cov_adaptive_target_points: 100
      max_flow_cov: 100.0
      border: 8
      grid_rows: 8
      grid_cols: 8
      max_points_per_cell: 20

    pnp:
      reproj_error_px: 3.0
      confidence: 0.999
      iterations: 100
      min_inliers: 20
      min_inlier_ratio: 0.25
      refine: true

    verification:
      max_mean_reproj_error_px: 3.0
      max_rotation_diff_deg: 35.0
      max_translation_diff_m: 8.0

    loop_information:
      trans_weight: 1.0
      rot_weight: 1.0

    # Phase B.5 is diagnostics-only until a reviewed calibration manifest is promoted.
    phase_b5:
      enabled: true
      mode: observe               # disabled | observe | apply
      trusted_manifest: null
      calibration:
        prefix_fraction: 0.2
        min_queries: 20
        min_all_bow_pairs: 100
        min_orb_pairs: 30
        # Freeze these on the development sequence before any apply run.
        absolute_median_log_risk_cap: null
        absolute_q95_log_risk_cap: null
      orb:
        ratio: 0.8
        max_depth: 20.0
      flow:
        min_valid_points: 30
        min_valid_ratio: 0.8
        min_grid_cells: 8
        nms_kernel_size: 7
        border: 8
        min_points: 30
        max_points: 800
        max_depth: 20.0
        grid_rows: 8
        grid_cols: 8
        max_points_per_cell: 20

Data: !include ../../Sequence/TartanAir_example.yaml
Preprocess: !include ../Common/Preprocess.yaml
