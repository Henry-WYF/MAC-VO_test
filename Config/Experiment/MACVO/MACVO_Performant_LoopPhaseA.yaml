Common:
  device: &device cuda

Odometry:
  name: MACVO-Performant-LoopPhaseA
  args:
    device: *device
    edgewidth: 32
    num_point: 200
    match_cov_default: 0.25
    profile: false
    mapping: true

  cov:
    obs:
      type: MatchCovariance
      args:
        device: *device
        kernel_size: 31
        match_cov_default: 0.25
        min_depth_cov: 0.05
        min_flow_cov: 0.25

  keypoint:
    type: CovAwareSelector_NoDepth
    args:
      device: *device
      kernel_size: 7
      mask_width: 32
      max_match_cov: 100.0

  mappoint:
    type: MappingPointSelector
    args:
      device: *device
      max_depth: 5.0
      max_depth_cov: 0.005
      mask_width: 32

  frontend:
    type: CUDAGraph_FlowFormerCovFrontend
    args:
      device: *device
      weight: ./Model/MACVO_FrontendCov.pth
      enc_dtype: fp32
      dec_dtype: fp32
      decoder_depth: 12
      enforce_positive_disparity: false

  motion:
    type: StaticMotionModel
    args:

  outlier:
    type: CovarianceSanityFilter
    args:

  postprocess:
    type: MotionInterpolate
    args:

  keyframe:
    type: AllKeyframe
    args:

  optimizer:
    type: TwoFrame_PGO
    args:
      device: cpu
      vectorize: true
      parallel: true
      graph_type: disp
      autodiff: false

  loop_closure:
    enabled: true
    vocabulary_path: ./Model/ORB_BoW_4096.npz
    keyframe_stride_sensor_frames: 10
    temporal_exclusion_sensor_frames: 50
    cache_failure_policy: disable_loop
    orb_nfeatures: 1000
    orb_scale_factor: 1.2
    orb_nlevels: 8
    top_k: 10

Data: !include ../../Sequence/TartanAir_example.yaml
Preprocess: !include ../Common/Preprocess.yaml
